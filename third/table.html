<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><table></table></title>
    <style>
      table,
      thead,
      th,
      tr,
      td {
        border: 1px solid;
        border-collapse: collapse;
      }

      </thead>
      <tbody>
        <tr>
          <td>좌석</td>
          <td>좌석</td>
          <td>좌석</td>
          <td>좌석</td>
          <td>좌석</td>
          <td>좌석</td>
          <td>좌석</td>
          <td>좌석</td>
        </tr>
      </tbody>
      <tfoot>
        <td>사물함</td>
        <td>사물함</td>
        <td>사물함</td>
        <td>사물함</td>
        <td>사물함</td>
        <td>사물함</td>
        <td>사물함</td>
        <td>사물함</td>
      </tfoot>
    </table>
  </body>
</html>
