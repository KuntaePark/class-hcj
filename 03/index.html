<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="wrap">
      <form id="regisForm">
        <h2>회원가입</h2>
        <label for="regisId">아이디</label>
        <input type="text" id="regisId" placeholder="아이디" />

        <label for="regisPwd">비밀번호</label>
        <input type="password" id="regisPwd" placeholder="비밀번호" />
        <label for="regisPwdConfirm">비밀번호 확인</label>
        <input
          type="password"
          id="regisPwdConfirm"
          placeholder="비밀번호 확인"
        />
        <label for="regisBirth">생년월일</label>
        <input type="text" id="regisBirth" placeholder="YYMMDD" />
        <div>
          <button>회원가입</button>
          <button type="button" id="cancelBtn">취소</button>
        </div>
      </form>
    </div>
    <script src="index.js"></script>
  </body>
</html>
